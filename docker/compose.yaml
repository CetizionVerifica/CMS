# Local services for development and tests. Started by `pnpm dev` (or `pnpm db:up`).
name: canopy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: canopy
      POSTGRES_DB: canopy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canopy -d canopy']
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for evidence files (SeaweedFS; MinIO no longer publishes community images).
  s3:
    # Fixed volume count and size: `-volume.max=0` would size it from free disk in 30 GB volumes and leave none
    # writable on a machine with less than 30 GB free.
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -volume.max=16 -master.volumeSizeLimitMB=128
    ports:
      - '9000:9000'
    volumes:
      - s3-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1']
      interval: 2s
      timeout: 5s
      retries: 60

  # Creates the evidence bucket once storage is up, then exits.
  s3-init:
    profiles: ['init']
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q canopy-evidence ||
        echo 's3.bucket.create -name canopy-evidence' | weed shell -master=s3:9333
    restart: 'no'

volumes:
  postgres-data:
  s3-data:
