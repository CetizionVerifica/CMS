name: CI

on:
  pull_request:
    # ready_for_review: a draft skips the audit, so marking it ready must re-run CI with the audit.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # The merge queue on `main` tests each PR combined with main and the PRs queued ahead of it, so two PRs that pass
  # alone but break together never both land.
  merge_group:

# A new push cancels the PR's older run. A re-run (attempt 2+, e.g. audit-verdict.yml re-checking the audit) gets a
# group of its own, so it never cancels the run for a newer push, nor is cancelled by it.
concurrency:
  group: ci-${{ github.ref }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `turbo --affected` can diff against the PR base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On PRs, typecheck and test only the packages the PR changes (and their dependents).
      # Root config or lockfile changes still run everything. main always runs everything.
      - run: pnpm ${{ matrix.task }} ${{ github.event_name == 'pull_request' && matrix.task != 'lint' && '--affected' || '' }}
        env:
          # turbo looks for a local `main`, which a PR checkout doesn't have, then falls back to running every package.
          TURBO_SCM_BASE: origin/${{ github.base_ref }}

  # Tests that need a real database (tenant isolation, migrations). Packages opt in with a `test:db` script.
  db:
    name: db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canopy -d canopy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://canopy:canopy@localhost:5432/canopy
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canopy/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Tooling tests (path guard, wave planner, no overlapping module paths, audit verdict gate). Also runs in the merge queue, so two
  # queued PRs that each edit tooling/modules.json are checked together.
  tooling:
    name: tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test tooling/scripts/*.test.mjs .github/scripts/*.test.mjs
      # New ADRs are docs/adr/M<n>-NNNN-slug.md, unique per module and number (check-adrs.mjs). Also runs in the queue.
      - run: node tooling/scripts/check-adrs.mjs

  # A PR titled "M<n>: ..." may only change the paths that module owns (tooling/modules.json).
  module-paths:
    name: module-paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node tooling/scripts/check-module-paths.mjs "$PR_TITLE" "origin/$BASE_REF"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fails on any known high or critical vulnerability in the dependency tree.
      - run: pnpm audit --audit-level=high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  # Independent audit (.claude/skills/compliance-module-auditor) of every ready PR: module PRs ("M<n>: ...") against
  # their MODULES.md acceptance list, any other PR (CI, docs, Dependabot) against the root CLAUDE.md rules. A session
  # that did not build the PR runs the skill and posts its report as a PR comment ending in a verdict marker for the head
  # SHA; this job only reads the comments (.github/scripts/audit-verdict.mjs), so CI calls no model API. Fails closed: no
  # Ready marker for the current head SHA from someone with write access, no merge. audit-verdict.yml re-runs this job when a marker is posted.
  # Also runs in the merge queue, so a Not-ready verdict posted after a PR was queued stops it from merging.
  module-audit:
    name: module-audit
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Require a Ready audit of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          cd "$RUNNER_TEMP"
          if [ -n "$QUEUE_REF" ]; then
            # Queue refs look like refs/heads/gh-readonly-queue/main/pr-<n>-<base sha>; judge that PR's current head.
            PR=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$QUEUE_REF")
            if [ -z "$PR" ]; then echo "::error::Can't read the PR number from $QUEUE_REF."; exit 1; fi
            SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments" | jq 'add // []' > comments.json
          # Repo permission of everyone who posted a marker; author_association can't tell write access from read.
          jq -r '[.[] | select(.body // "" | contains("<!-- canopy-audit sha=")) | .user.login] | unique[]' comments.json |
            while read -r login; do
              perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .permission 2>/dev/null || echo none)
              echo "$login: $perm" >&2
              jq -n --arg l "$login" --arg p "$perm" '{($l): $p}'
            done | jq -s 'add // {}' > permissions.json
          node "$GITHUB_WORKSPACE/.github/scripts/audit-verdict.mjs" "$SHA" comments.json permissions.json

  # Single status to mark as required in branch protection, so new jobs don't need settings changes.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks, tooling, db, e2e, module-paths, audit, codeql, module-audit]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # A PR's ci-ok is green only after a Ready audit. Drafts skip the audit, so their ci-ok is red: otherwise
      # auto-merge could act on the draft's green check before the run started by ready_for_review reports.
      # Pushes to main skip module-audit, and the merge queue skips module-paths; the PR run already passed them.
      - if: github.event_name != 'push' && needs.module-audit.result != 'success'
        run: |
          echo "::error::No Ready audit for this commit. Drafts are not audited; mark the PR ready, then post an audit of its head SHA from a separate session (module-audit log says why)."
          exit 1
      - run: echo "All CI jobs passed."
