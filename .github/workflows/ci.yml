name: CI

on:
  pull_request:
    # ready_for_review: a draft skips the audit, so marking it ready must re-run CI with the audit.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # The merge queue on `main` tests each PR combined with main and the PRs queued ahead of it, so two PRs that pass
  # alone but break together never both land.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `turbo --affected` can diff against the PR base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On PRs, typecheck and test only the packages the PR changes (and their dependents).
      # Root config or lockfile changes still run everything. main always runs everything.
      - run: pnpm ${{ matrix.task }} ${{ github.event_name == 'pull_request' && matrix.task != 'lint' && '--affected' || '' }}

  # Tests that need a real database (tenant isolation, migrations). Packages opt in with a `test:db` script.
  db:
    name: db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canopy -d canopy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://canopy:canopy@localhost:5432/canopy
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canopy/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Tooling tests (path guard, wave planner, no overlapping module paths). Also runs in the merge queue, so two
  # queued PRs that each edit tooling/modules.json are checked together.
  tooling:
    name: tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test tooling/scripts/*.test.mjs

  # A PR titled "M<n>: ..." may only change the paths that module owns (tooling/modules.json).
  module-paths:
    name: module-paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node tooling/scripts/check-module-paths.mjs "$PR_TITLE" "origin/$BASE_REF"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fails on any known high or critical vulnerability in the dependency tree.
      - run: pnpm audit --audit-level=high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  # Independent audit (.claude/skills/compliance-module-auditor) of every ready PR: module PRs ("M<n>: ...") against
  # their MODULES.md acceptance list, any other PR (CI, docs, Dependabot) against the root CLAUDE.md rules. Runs after
  # the mechanical checks so it can rely on their results. Fails closed: without the ANTHROPIC_API_KEY secret (and, for
  # Dependabot PRs, the Dependabot secret of the same name) no PR can merge unaudited. Not run in the merge queue: the
  # audit is of the PR's own change, which the queue does not alter.
  module-audit:
    name: module-audit
    needs: [checks, module-paths]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Require the audit key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set, so this PR cannot be audited. Add it under Settings > Secrets and variables (Actions, and Dependabot for dependency PRs)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No install scripts in the job that holds the API key.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'dependabot[bot]'
          prompt: |
            Use the compliance-module-auditor skill to audit PR #${{ github.event.pull_request.number }}
            at ${{ github.event.pull_request.head.sha }} against
            base ${{ github.base_ref }}. Lint, typecheck, unit tests with coverage and the path guard already passed.
            If the title has no module id, audit the diff against the root CLAUDE.md non-negotiables and quality
            gates instead of a MODULES.md acceptance list.
            Post the report as one PR comment with `gh pr comment`, then return the verdict as the structured
            output.
          claude_args: >-
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["Ready","Not ready"]}},"required":["verdict"]}'
            --allowedTools "Read,Grep,Glob,Bash(pnpm lint*),Bash(pnpm typecheck*),Bash(pnpm test*),Bash(node --test tooling/scripts/*),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *)"
      # The verdict comes back as validated structured output, not a file the model has to write.
      - name: Require a Ready verdict
        env:
          VERDICT: ${{ fromJSON(steps.audit.outputs.structured_output || '{}').verdict }}
        run: |
          echo "Audit verdict: ${VERDICT:-missing}"
          test "$VERDICT" = "Ready"

  # Single status to mark as required in branch protection, so new jobs don't need settings changes.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks, tooling, db, e2e, module-paths, audit, codeql, module-audit]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # A PR's ci-ok is green only after a Ready audit. Drafts skip the audit, so their ci-ok is red: otherwise
      # auto-merge could act on the draft's green check before the run started by ready_for_review reports.
      # The merge queue and pushes to main skip module-paths and module-audit; the PR run already passed them.
      - if: github.event_name == 'pull_request' && needs.module-audit.result != 'success'
        run: |
          echo "::error::No Ready audit for this commit. Drafts are not audited; mark the PR ready for review."
          exit 1
      - run: echo "All CI jobs passed."
