name: Cleanup

# Deletes a PR's branch once it merges. GitHub then moves any PR that was stacked on that branch over to the merged
# PR's base (usually `main`), so stacked PRs land on `main` instead of on a dead branch.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "Branch already deleted."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
