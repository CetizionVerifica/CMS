name: Auto-merge

# Turns on GitHub auto-merge for every ready (non-draft) PR from this repo. Once the checks required on `main` pass
# (`ci-ok`, which includes the audit) and any code owner review (.github/CODEOWNERS) is approved, the PR joins the
# merge queue, which re-runs `ci-ok` on it combined with `main` and squash-merges it. Add the `no-automerge` label to
# keep a PR open.
#
# Needs, in repo settings: "Allow auto-merge" on, and a `main` ruleset requiring `ci-ok` and a merge queue (squash).
# Without a required check GitHub refuses to enable auto-merge, so this never merges a PR before its checks have run.
#
# Auto-merge must be turned on with the AUTOMERGE_TOKEN secret (a fine-grained token or GitHub App token with
# Contents and Pull requests write on this repo), never GITHUB_TOKEN. GitHub queues the PR as whoever turned
# auto-merge on, and a merge group queued as GITHUB_TOKEN starts no workflow run. Its ci-ok never reports, and it
# blocks every PR behind it until the queue's 60-minute timeout. Without the secret this job only leaves a notice, and
# the PR is queued by hand once it is audited and green.

# pull_request_target, so main's copy of this file runs and a PR can't edit it to read AUTOMERGE_TOKEN. It checks out
# no code and uses only event metadata.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTOMERGE_TOKEN is not set; queue PR #$PR by hand once it is audited and green."
            exit 0
          fi
          gh pr merge "$PR" --auto --squash --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  disable:
    if: github.event.action == 'labeled' && github.event.label.name == 'no-automerge'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge "$PR" --disable-auto --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
