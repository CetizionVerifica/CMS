name: Audit verdict

# When someone posts or edits an audit report carrying a verdict marker (see
# .github/scripts/audit-verdict.mjs), re-run the PR's `module-audit` job on its latest CI run, and with it `ci-ok`,
# so the new verdict counts without a push, then puts a now-green PR in the merge queue. The gate itself lives in
# ci.yml; this only re-evaluates it.
# Runs from main and checks out no code, so a PR cannot change what it does.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

# Per commenter, so someone without write access can't cancel a run started by someone with it.
concurrency:
  group: audit-verdict-${{ github.event.issue.number }}-${{ github.event.comment.user.id }}
  cancel-in-progress: true

jobs:
  rerun:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- canopy-audit sha=') &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Re-run module-audit on the PR's latest CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          # Only a verdict from someone with write access can change the gate, so only they trigger a re-run.
          PERM=$(gh api "repos/$GH_REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERM" in admin|maintain|write) ;; *) echo "$AUTHOR has $PERM access; ignoring."; exit 0 ;; esac
          read -r SHA DRAFT < <(gh pr view "$PR" --json headRefOid,isDraft --jq '"\(.headRefOid) \(.isDraft)"')
          if [ -z "$SHA" ]; then echo "::error::Could not read PR #$PR."; exit 1; fi
          if [ "$DRAFT" = "true" ]; then echo "PR is a draft; marking it ready runs the gate."; exit 0; fi
          # A verdict for an older commit can't change the gate, and re-running that commit's CI would only waste it.
          if ! grep -qE "^\s*<!-- canopy-audit sha=$SHA verdict=(Ready|Not-ready) -->\s*$" <<< "$BODY"; then
            echo "The marker is not for the PR's head $SHA; its CI run reads the comments itself."; exit 0
          fi
          RUN=$(gh run list --workflow ci.yml --event pull_request --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN" ]; then echo "No CI run for $SHA yet; it will read the verdict when it runs."; exit 0; fi
          # A job can only be re-run once its run has finished; one still running reads the comments itself unless
          # module-audit already finished, so wait and re-run it either way.
          gh run watch "$RUN" --interval 30 > /dev/null || true
          if [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" != "$SHA" ]; then
            echo "PR #$PR moved past $SHA while waiting; the new commit needs its own audit."; exit 0
          fi
          read -r JOB OUTCOME < <(gh run view "$RUN" --json jobs --jq '.jobs[] | select(.name == "module-audit") | "\(.databaseId) \(.conclusion)"')
          if [ -z "$JOB" ]; then echo "::error::Run $RUN has no module-audit job."; exit 1; fi
          # Jobs other than the gate that genuinely failed; an audit must never quietly retry those.
          FAILED=$(gh run view "$RUN" --json jobs --jq '[.jobs[] | select(.conclusion == "failure" and .name != "module-audit" and .name != "ci-ok") | .name] | join(", ")')
          if [ "$OUTCOME" != "success" ] && [ -z "$FAILED" ]; then
            # Only the gate failed or was cancelled: re-run it with every cancelled job (a run cancelled by a newer push or a
            # re-run), so ci-ok isn't left red by jobs that never finished. `--failed` covers failed and cancelled.
            gh run rerun "$RUN" --failed
          else
            # The verdict changed on an otherwise finished run, or other jobs really failed: re-run module-audit and
            # the jobs that need it (ci-ok) only.
            [ -n "$FAILED" ] && echo "Not re-running failed jobs: $FAILED."
            gh run rerun --job "$JOB"
          fi
          echo "Re-ran the gate on run $RUN for $SHA."
          # Auto-merge doesn't always notice a required check turning green on a re-run, which left an audited PR
          # waiting outside the merge queue. Once the re-run finishes green, turn auto-merge off and on again so
          # the PR joins the queue now. Only for a PR from this repo whose auto-merge is on, as auto-merge.yml sets
          # it: a fork PR, a `no-automerge` label or auto-merge turned off by hand still holds it.
          sleep 15
          gh run watch "$RUN" --interval 20 > /dev/null || true
          read -r STATE QUEUED AUTO FORK HELD < <(gh api graphql -F n="$PR" -f o="${GH_REPO%/*}" -f r="${GH_REPO#*/}" -f query='
            query($o: String!, $r: String!, $n: Int!) { repository(owner: $o, name: $r) { pullRequest(number: $n) {
              mergeStateStatus isInMergeQueue isCrossRepository autoMergeRequest { enabledAt }
              labels(first: 50) { nodes { name } } } } }' \
            --jq '.data.repository.pullRequest | "\(.mergeStateStatus) \(.isInMergeQueue) \(.autoMergeRequest != null) \(.isCrossRepository) \(any(.labels.nodes[]; .name == "no-automerge"))"')
          echo "PR #$PR is $STATE; queued $QUEUED, auto-merge $AUTO, fork $FORK, held $HELD."
          if [ "$STATE" = "CLEAN" ] && [ "$QUEUED" = "false" ] && [ "$AUTO" = "true" ] && [ "$FORK" = "false" ] && [ "$HELD" = "false" ]; then
            gh pr merge "$PR" --disable-auto || true
            gh pr merge "$PR" --auto --squash
          fi
